name: Keepalive Supabase & Repository

on:
  schedule:
    # Esegue ogni 2 giorni alle 06:00 UTC
    - cron: '0 6 */2 * *'
  workflow_dispatch:
    inputs:
      force_heartbeat:
        description: 'Imposta a "true" per forzare l''heartbeat immediato su ramo dedicato keepalive-heartbeat'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  ping-supabase-and-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Esecuzione Query REST su Supabase (Anti-Pausa)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://lpeiyzwccedtqjbficjo.supabase.co' }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwZWl5endjY2VkdHFqYmZpY2pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTgzNTQsImV4cCI6MjEwNzQ5NDM1NH0.9eIZRUNLPlJn1l4DMs46DNauFdi_32X2y6YBZ1ytZSQ' }}
        run: |
          echo "Verifica stato istanza database Supabase..."
          RESPONSE_CODE=$(curl -s -o response_body.json -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/giochi?select=id&limit=1")
          
          echo "Codice di risposta HTTP: $RESPONSE_CODE"
          cat response_body.json || true
          
          # Verifica che la risposta sia compresa tra 200 e 299
          if [ "$RESPONSE_CODE" -lt 200 ] || [ "$RESPONSE_CODE" -gt 299 ]; then
            echo "::error::ERRORE KEEPALIVE! Risposta non valida da Supabase ($RESPONSE_CODE). Il database potrebbe essere in pausa o non raggiungibile."
            exit 1
          fi
          echo "Keepalive Supabase completato con successo (HTTP $RESPONSE_CODE)."

      - name: Verifica e Heartbeat 60 Giorni Inattività GitHub (Ramo Dedicato)
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          echo "Giorni trascorsi dall'ultimo commit sul repository: $DIFF_DAYS"

          # Se sono trascorsi più di 40 giorni o se forzato via dispatch, effettua commit su ramo dedicato
          if [ "$DIFF_DAYS" -gt 40 ] || [ "${{ github.event.inputs.force_heartbeat }}" = "true" ]; then
            echo "Esecuzione heartbeat di attività su ramo dedicato keepalive-heartbeat..."
            echo "Questo azzera il conteggio dei 60 giorni senza mai toccare né richiedere bypass su main."
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git checkout -B keepalive-heartbeat
            echo "Ultimo heartbeat automatico di attività repository: $(date -u +"%Y-%m-%d %H:%M:%SZ")" > docs/keepalive_heartbeat.txt
            git add docs/keepalive_heartbeat.txt
            git commit -m "chore(keepalive): heartbeat reset 60gg inattività [skip ci]" || echo "Nessuna modifica da committare"
            git push origin keepalive-heartbeat --force
            echo "Heartbeat inviato con successo sul ramo keepalive-heartbeat. Il ramo main rimane rigorosamente protetto."
          else
            echo "Repository attivo (meno di 40 giorni dall'ultimo commit). Nessun heartbeat necessario."
          fi
