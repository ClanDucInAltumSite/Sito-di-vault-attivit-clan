name: Manutenzione Automatica Settimanale

on:
  schedule:
    # Ogni lunedì alle 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  maintenance-check:
    name: Audit Sicurezza, Dipendenze e Keepalive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Controllo Vulnerabilità (npm audit)
        id: audit
        continue-on-error: true
        run: |
          echo "Esecuzione npm audit per vulnerabilità high e critical..."
          npm audit --audit-level=high --json > audit-report.json || true
          VULN_COUNT=$(node -e "try { const r = JSON.parse(require('fs').readFileSync('audit-report.json','utf8')); console.log(r.metadata?.vulnerabilities?.high + r.metadata?.vulnerabilities?.critical || 0); } catch { console.log(0); }")
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          echo "Vulnerabilità High/Critical rilevate: $VULN_COUNT"

      - name: Controllo Dipendenze Obsolete (npm outdated)
        id: outdated
        continue-on-error: true
        run: |
          echo "Esecuzione npm outdated..."
          npm outdated --json > outdated-report.json || true
          OUTDATED_COUNT=$(node -e "try { const r = JSON.parse(require('fs').readFileSync('outdated-report.json','utf8')); console.log(Object.keys(r).length || 0); } catch { console.log(0); }")
          echo "outdated_count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT
          echo "Pacchetti obsoleti rilevati: $OUTDATED_COUNT"

      - name: Controllo Stato Ultima Esecuzione Keepalive
        id: keepalive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Verifica stato ultimo run del workflow Keepalive..."
          STATUS=$(gh run list --workflow=keepalive.yml --limit=1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "unknown")
          echo "keepalive_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Esito ultimo keepalive: $STATUS"

      - name: Apertura Issue Segnalazione Manutenzione
        if: ${{ fromJSON(steps.audit.outputs.vuln_count || '0') > 0 || fromJSON(steps.outdated.outputs.outdated_count || '0') > 5 || steps.keepalive.outputs.keepalive_status == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_BODY="### Riepilogo Manutenzione Settimanale Automatica

- **Vulnerabilità di sicurezza (High/Critical):** ${{ steps.audit.outputs.vuln_count }}
- **Dipendenze con aggiornamenti disponibili:** ${{ steps.outdated.outputs.outdated_count }}
- **Stato Keepalive Supabase/GitHub:** \`${{ steps.keepalive.outputs.keepalive_status }}\`

#### Azioni Consigliate:
1. Se sono presenti vulnerabilità, eseguire \`npm audit fix\` in un ramo dedicato e validare con CI.
2. Esaminare le dipendenze segnalate ed aggiornare quelle con fix minori.
3. Se il Keepalive è fallito, verificare che il database Supabase sia raggiungibile e non in pausa."

          gh issue create \
            --title "🔧 Segnalazione Manutenzione: vulnerabilità o dipendenze da verificare" \
            --body "$REPORT_BODY" \
            --label "maintenance,automated"
