name: Manutenzione Automatica Settimanale

on:
  schedule:
    # Ogni lunedi alle 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  maintenance-check:
    name: Audit Sicurezza, Dipendenze e Keepalive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installazione dipendenze minime
        run: npm ci

      - name: Esecuzione Controllo Manutenzione
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/run_maintenance.mjs
