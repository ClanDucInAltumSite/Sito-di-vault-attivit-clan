name: Applica Schema su Staging

on:
  push:
    paths:
      - 'supabase/full_schema.sql'
      - 'supabase/migrations/**'
      - 'scripts/apply_staging_schema.mjs'
      - '.github/workflows/staging-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-schema-apply
  cancel-in-progress: false

jobs:
  apply-schema:
    name: Prova Migrazione su Ambiente di Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Applicazione full_schema.sql su Staging
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || vars.STAGING_SUPABASE_URL }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF || vars.STAGING_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/apply_staging_schema.mjs

      - name: Esecuzione Test di Scrittura e Sicurezza Admin su Staging
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || vars.STAGING_SUPABASE_ANON_KEY }}
          ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
        run: |
          if [ -n "$ADMIN_TEST_EMAIL" ] && [ -n "$ADMIN_TEST_PASSWORD" ]; then
            echo "Esecuzione test funzionale admin su Staging..."
            node scripts/run_admin_test.mjs
          else
            echo "Credenziali admin di test non configurate nell'environment staging. Test admin saltato."
          fi
