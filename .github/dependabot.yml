# .github/dependabot.yml
# FASE 12F — Configurazione Dependabot per aggiornamenti di sicurezza e dipendenze
# Gli aggiornamenti generano PR controllate con CI obbligatoria (nessun merge automatico).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    reviewers:
      - "LucaRenz"
    labels:
      - "dependencies"
      - "security"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Non aggiornare major release non verificate a mano
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
